---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
spec:
  serviceName: argocd-application-controller
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-application-controller
        app.kubernetes.io/part-of: argocd
    spec:
      # Chỉ định chạy trên monitoring-worker hoặc node có label specific
      nodeSelector:
        kubernetes.io/hostname: monitoring-worker
        workload-type: gitops
      
      # Toleration nếu worker node có taint
      # tolerations:
      # - key: workload-type
      #   operator: Equal
      #   value: gitops
      #   effect: NoSchedule

      serviceAccountName: argocd-application-controller
      containers:
      - name: argocd-application-controller
        image: quay.io/argoproj/argocd:v2.10.0
        imagePullPolicy: IfNotPresent
        
        # Giới hạn tài nguyên RAM và CPU
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        # Liveness probe
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 30
        
        env:
        - name: ARGOCD_CONTROLLER_REPLICAS
          value: "1"
        - name: ARGOCD_RECONCILIATION_TIMEOUT
          value: 180s
        - name: ARGOCD_APPLICATION_INSTANCELABELSELECTOR
          value: "argocd.argoproj.io/instance"
        - name: ARGOCD_NOTIFICATION_CONTROLLER_LOGLEVEL
          value: "info"
        
        volumeMounts:
        - name: ssh-known-hosts-cm
          mountPath: /home/argocd/.ssh
        - name: tls-certs
          mountPath: /home/argocd/.argocd/tls
      
      volumes:
      - name: ssh-known-hosts-cm
        configMap:
          name: argocd-ssh-known-hosts-cm
          defaultMode: 0644
      - name: tls-certs
        configMap:
          name: argocd-tls-certs-cm
          defaultMode: 0644

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-application-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
spec:
  ports:
  - name: metrics
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app.kubernetes.io/name: argocd-application-controller
  type: ClusterIP
