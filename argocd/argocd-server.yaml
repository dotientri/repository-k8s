---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
        app.kubernetes.io/part-of: argocd
    spec:
      # Chỉ định chạy trên monitoring-worker
      nodeSelector:
        kubernetes.io/hostname: monitoring-worker
        workload-type: gitops
      
      # Tùy chọn: Sử dụng node affinity thay vì nodeSelector
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: node-role.kubernetes.io/worker
      #           operator: In
      #           values:
      #           - "true"
      #         - key: workload-type
      #           operator: In
      #           values:
      #           - gitops

      serviceAccountName: argocd-server
      containers:
      - name: argocd-server
        image: quay.io/argoproj/argocd:v2.10.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: server
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8083
          protocol: TCP
        
        # Giới hạn tài nguyên RAM và CPU
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Liveness và Readiness probe
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        env:
        - name: ARGOCD_SERVER_INSECURE
          value: "false"
        - name: ARGOCD_SERVER_DISABLE_AUTH
          value: "false"
        
        volumeMounts:
        - name: ssh-known-hosts-cm
          mountPath: /home/argocd/.ssh
        - name: tls-certs
          mountPath: /home/argocd/.argocd/tls
        - name: argocd-repo-server-tls
          mountPath: /home/argocd/.argocd/server/tls
      
      volumes:
      - name: ssh-known-hosts-cm
        configMap:
          name: argocd-ssh-known-hosts-cm
          defaultMode: 0644
      - name: tls-certs
        configMap:
          name: argocd-tls-certs-cm
          defaultMode: 0644
      - name: argocd-repo-server-tls
        secret:
          secretName: argocd-repo-server-tls
          defaultMode: 0644

---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: argocd-server
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
